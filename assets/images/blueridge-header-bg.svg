<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <!-- Light Blue Ridge Sky / Atmospheric Background (Exact light watercolor from logo) -->
    <linearGradient id="logoSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FD" />
      <stop offset="35%" stop-color="#DEEDFB" />
      <stop offset="70%" stop-color="#C5DEF6" />
      <stop offset="100%" stop-color="#AECFF0" />
    </linearGradient>

    <!-- Ridge 1 (Far Light Blue Peaks) -->
    <linearGradient id="ridgeFarLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#82A9D4" />
      <stop offset="100%" stop-color="#6792C4" />
    </linearGradient>

    <!-- Ridge 2 (Mid-Distance Slate Blue Ridge) -->
    <linearGradient id="ridgeMidBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4673A7" />
      <stop offset="100%" stop-color="#315B8E" />
    </linearGradient>

    <!-- Ridge 3 (Near Rich Appalachian Blue Ridge) -->
    <linearGradient id="ridgeNearBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#234775" />
      <stop offset="100%" stop-color="#18365D" />
    </linearGradient>

    <!-- Ridge 4 (Deep Navy / Black Mountain Base Contour from Logo) -->
    <linearGradient id="ridgeDeepBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102542" />
      <stop offset="100%" stop-color="#091526" />
    </linearGradient>
  </defs>

  <!-- 1. Super Light Sky Canvas -->
  <rect width="1600" height="240" fill="url(#logoSky)" />

  <!-- 2. Far Distant Mountain Peaks (Sharp, dramatic ridges) -->
  <path d="M0,65 
           L110,40 L190,75 L280,35 L420,80 L520,38 L650,75 L790,30 L930,78 L1040,35 L1190,82 L1320,42 L1460,80 L1600,45 
           L1600,240 L0,240 Z" 
        fill="url(#ridgeFarLight)" opacity="0.9" />

  <!-- 3. Mid-Distance Overlapping Ridge -->
  <path d="M0,105 
           Q100,75 220,95 T460,78 T700,102 T920,80 T1160,108 T1380,82 T1600,100 
           L1600,240 L0,240 Z" 
        fill="url(#ridgeMidBlue)" />

  <!-- 4. Near Mountain Slope Layer -->
  <path d="M0,142 
           Q140,115 300,138 T620,120 T940,145 T1260,122 T1600,140 
           L1600,240 L0,240 Z" 
        fill="url(#ridgeNearBlue)" />

  <!-- 5. Front Heavy Base Ridge (Contrasting deep silhouette base) -->
  <path d="M0,182 
           Q90,168 200,180 T440,170 T680,184 T920,172 T1160,185 T1400,172 T1600,180 
           L1600,240 L0,240 Z" 
        fill="url(#ridgeDeepBase)" />
</svg>
